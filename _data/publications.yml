    anchor: pub-annsim
    abstract: >-
      Traffic flow modeling is an essential part of civil planning around the world,
      and traffic simulation is an important component of the analyses that city
      planners must perform to ensure safe and efficient road networks for their
      citizens. This work advances microscopic traffic simulation through lane-level
      validation of speed and flow dynamics, addressing a critical gap in conventional
      macro-aggregated approaches. We systematically evaluate the trade-offs between
      numerical integration methods and vehicle arrival processes when reproducing
      empirical trajectory data from California’s freeway network. Results demonstrate
      that numerical-integrator choice has negligible impact on simulation accuracy,
      with less than one percent variation across eight methods, while vehicle
      arrival-process modeling substantially affects fidelity. The shifted Erlang-2
      distribution reduces flow-prediction error by approximately 28% compared to
      Poisson processes by enforcing a realistic minimum headway. Lane-level
      validation across five detector stations reveals lane-specific dynamics that
      aggregated metrics often obscure.
