    license_url: "https://creativecommons.org/licenses/by/4.0/"
    license_name: "CC BY 4.0"
    anchor: pub-bigdata
    abstract: >-
      Zero-shot time-series foundation models (TSFMs) have become attractive alternatives
      to task-specific models because they handle diverse downstream tasks, including
      anomaly detection and forecasting, without per-series training. However, time-series
      data undergo distribution shifts, and the dissimilarity between two regimes is
      commonly scored with statistical measures such as Wasserstein-1, where a higher
      score is read as a more severe shift. In systematic experiments using three
      established severity measures on nine regime shifts from three standard traffic
      datasets, we show that these measures do not reliably predict degradation for
      instance-normalized TSFMs. The regimes rated most severe are not the regimes that
      degrade the models most, and degradation reaches 29% in the lowest-scoring regime.
      In most cases, the audit shows no positive relationship between measured severity
      and model degradation. We provide an equivariance-based stress-testing analysis
      that explains why severity readings can become decoupled from model degradation.

